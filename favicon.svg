<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3480"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lgGd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#lgBg)"/>
  <!-- Inner border highlight -->
  <rect x="1" y="1" width="38" height="38" rx="9.5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <!-- Top shine -->
  <ellipse cx="20" cy="2" rx="16" ry="5" fill="rgba(255,255,255,.07)"/>
  <!-- M letterform -->
  <path d="M9.5 27 L9.5 13.5 L20 22.5 L30.5 13.5 L30.5 27" stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gold accent bar -->
  <rect x="9" y="30" width="22" height="2.5" rx="1.25" fill="url(#lgGd)"/>
  <!-- Gold dots at M peaks -->
  <circle cx="9.5" cy="13.5" r="1.8" fill="url(#lgGd)"/>
  <circle cx="30.5" cy="13.5" r="1.8" fill="url(#lgGd)"/>
  <circle cx="20" cy="22.5" r="1.8" fill="url(#lgGd)"/>
</svg>
