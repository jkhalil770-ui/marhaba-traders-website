<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E8D07A"/>
      <stop offset="100%" stop-color="#8A6A1A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070C1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Circular Background -->
  <circle cx="20" cy="20" r="19.5" fill="url(#bgGrad)"/>
  <!-- Golden Border -->
  <circle cx="20" cy="20" r="18.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  
  <!-- Stylized MT Monogram with Ascending Chart Bars -->
  <g transform="translate(1, 0.5)">
    <!-- Monogram M & T stems in Gold -->
    <path d="M 11 27.5 L 11 13.5 L 15.5 21 L 20 13.5 M 19 15.5 L 29 15.5 M 25 15.5 L 25 27.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Growth Bars representing financial readiness -->
    <!-- Bar 1 (Short) -->
    <rect x="13" y="23" width="1.8" height="4.5" rx="0.4" fill="url(#goldGrad)"/>
    <!-- Bar 2 (Medium) -->
    <rect x="15.8" y="19" width="1.8" height="8.5" rx="0.4" fill="url(#goldGrad)"/>
    <!-- Bar 3 (Tall) -->
    <rect x="18.6" y="15" width="1.8" height="12.5" rx="0.4" fill="url(#goldGrad)"/>
  </g>
</svg>
