/* UploadField */
function UploadField({def,val,onChange}){
  const ref=useRef(null);const files=val||[];
  const onF=e=>{onChange([...files,...Array.from(e.target.files)]);e.target.value='';};
  const rm=i=>onChange(files.filter((_,x)=>x!==i));
  return <div>
    <div className="f-up" onClick={()=>ref.current?.click()}>
      <UpIco/>
      <div><div className="f-up-t">{def.ph||'Click to upload / فائل اپلوڈ کریں'}</div>{def.ac&&<div className="f-up-s">Accepted: {def.ac}</div>}</div>
    </div>
    <input ref={ref} type="file" style={{display:'none'}} onChange={onF} multiple={def.multi!==false} accept={def.ac||'.pdf,.doc,.docx'}/>
    {files.length>0&&<div style={{marginTop:6,display:'flex',flexDirection:'column',gap:4}}>
      {files.map((f,i)=><div key={i} className="f-file"><span style={{display:'flex',alignItems:'center',gap:6}}><PpIco/><span className="f-fn">{f.name||f}</span></span><button className="f-rm" onClick={()=>rm(i)}><XIco/></button></div>)}

}

/* Field dispatcher */
function Field({def,val,onChange}){
  const base={width:'100%',padding:'10px 13px',border:'1.5px solid rgba(28,24,18,.10)',borderRadius:8,fontSize:13,background:'#fff',fontFamily:'inherit',color:'#1C1812',outline:'none',transition:'border-color .2s'};
  if(def.type==='up')return <UploadField def={def} val={val} onChange={onChange}/>;
  if(def.type==='legal')return <LegalField def={def} val={val} onChange={onChange}/>;
  if(['text','email','tel','url'].includes(def.type))
    return <input type={def.type} className="f-inp" placeholder={def.ph||''} value={val||''} onChange={e=>onChange(e.target.value)}/>;
  if(def.type==='ta')
    return <textarea className="f-inp f-ta" placeholder={def.ph||''} value={val||''} onChange={e=>onChange(e.target.value)} rows={3}/>;
  if(def.type==='sel')
    return <select className="f-inp f-sel" value={val||''} onChange={e=>onChange(e.target.value)}>
      <option value="">Select... / منتخب کریں</option>
      {(def.opts||[]).map(o=><option key={o}>{o}</option>)}
    </select>;
  if(def.type==='chips'){
    const sel=val||[];
    return <div className="chips">{(def.opts||[]).map(o=>{const on=sel.includes(o);return<button key={o} type="button" className={`chip${on?' on':''}`} onClick={()=>onChange(on?sel.filter(s=>s!==o):[...sel,o])}>{o}</button>;})}</div>;
  }
  if(def.type==='agree')
    return <label className={`agree-row${val?' checked':''}`}>
      <input type="checkbox" checked={val||false} onChange={e=>onChange(e.target.checked)}/>
      <span className="agree-txt">{def.en}</span>
    </label>;
  return null;
}

/* Grid layout */
function Grid({fields,fd,upd}){
  return <div className="f-grid">
    {fields.map(f=>{
      const full=['ta','chips','legal','up','agree'].includes(f.type);
      return <div key={f.id} className={full?'f-full':''}>
        {!['agree','legal'].includes(f.type)&&<BiLabel en={f.en} required={f.req}/>}
        <Field def={f} val={fd[f.id]} onChange={v=>upd(f.id,v)}/>
      </div>;
    })}
  </div>;
}

/* ── Supabase helpers ── */
async function uploadFile(file, userEmail) {
  const safe = userEmail.replace(/[^a-zA-Z0-9]/g,'_');
  const ext = file.name.split('.').pop();
  const path = `${safe}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await db.storage.from('marhaba_uploads').upload(path, file);
  if (error) throw error;
  return db.storage.from('marhaba_uploads').getPublicUrl(path).data.publicUrl;
}

async function serializeFormData(fd, userEmail) {
  const out = {};
  for (const [k, v] of Object.entries(fd)) {
    if (Array.isArray(v) && v.length && v[0] instanceof File) {
      out[k] = await Promise.all(v.map(f => uploadFile(f, userEmail)));
    } else if (v && v._file instanceof File) {
      const url = await uploadFile(v._file, userEmail);
      out[k] = { s: v.s, fn: v.fn, url };
    } else {
      out[k] = v;
    }
  }
  return out;
}

  if(done)return <PaymentDone onReset={()=>setDone(false)} userEmail={user.email} formType={tableName}/>;
  return <div>
    <div className="form-meta">
      <span className="form-meta-l">{title}</span>
      <span className="form-meta-r">{desc}</span>
    </div>
    {sections.map(s=><div key={s.sec} className="f-card">
      <div className="f-sh"><div className="f-dot"></div><div><div className="f-title">{s.sec}</div></div></div>
      <Grid fields={s.fields} fd={fd} upd={upd}/>
    </div>)}
    {err&&<div style={{color:'#dc2626',fontSize:13,marginTop:8,padding:'8px 12px',background:'#fef2f2',borderRadius:6,border:'1px solid #fca5a5'}}>⚠ {err}</div>}
    <div style={{display:'flex',justifyContent:'flex-end',marginTop:6}}>
      <button onClick={submit} disabled={loading} className="btn-dark" style={{opacity:loading?.6:1}}>
        {loading?'Saving…':'Submit Profile'} &nbsp;<ChrIco/>
      </button>
    </div>
  </div>;
}

/* Multi-step form (Full Profile) */
function StepForm({sections,fd,setFd,title,urTitle,desc,user,tableName}){
  const [step,setStep]=useState(0);const [done,setDone]=useState(false);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(null);
  const total=sections.length;
  const upd=(id,v)=>setFd(p=>({...p,[id]:v}));
  const sec=sections[step];
  const submit = async () => {
    setLoading(true); setErr(null);
    try {
      const payload = await serializeFormData(fd, user.email);
      const insertData = { email: user.email, data: payload };
      if (user.supabase_uid) {
        insertData.auth_user_id = user.supabase_uid;
      }
      const { error } = await db.from(tableName).insert(insertData);
      if (error) {
        console.error('Form save error:', error);
        setErr(error.message || 'Failed to save form data. Please try again.');
      } else {
        setDone(true);
      }
    } catch(e) {
      console.error('Submit error:', e);
      setErr(e.message || 'An unexpected error occurred. Please try again.');
    } finally {
      setLoading(false);
    }
  };
  if(done)return <PaymentDone onReset={()=>{setDone(false);setStep(0);}} userEmail={user.email} formType={tableName}/>;
  return <div>
    <div className="form-meta">
      <span className="form-meta-l">{title}</span>
      <span className="form-meta-r">Stage {step+1} of {total} · {Math.round(((step+1)/total)*100)}% complete</span>
    </div>
    <div className="prog-bar"><div className="prog-fill" style={{width:`${((step+1)/total)*100}%`}}></div></div>
    <div className="steps-scroll">
      {sections.map((s,i)=><button key={i} type="button" onClick={()=>setStep(i)} className={`step-pill${i===step?' active':i<step?' done':''}`}>
        {i<step&&<ChkIco/>}{i+1}. {s.title}
      </button>)}
    </div>
    <div className="f-card">
      <div className="f-sh">
        <div className="f-dot"></div>
        <div><div className="f-title">{sec.title}</div>{sec.sub&&<div className="f-sub">{sec.sub}</div>}</div>
      </div>
      <Grid fields={sec.fields} fd={fd} upd={upd}/>
    </div>
    {err&&<div style={{color:'#dc2626',fontSize:13,marginTop:8,padding:'8px 12px',background:'#fef2f2',borderRadius:6,border:'1px solid #fca5a5'}}>⚠ {err}</div>}
    <div className="nav-btns">
      <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0} className="btn-out" style={{opacity:step===0?.35:1}}>
        <ChlIco/> Back
      </button>
      {step<total-1
        ?<button onClick={()=>setStep(s=>s+1)} className="btn-gd">Next <ChrIco/></button>
        :<button onClick={submit} disabled={loading} className="btn-dark" style={{opacity:loading?.6:1}}>{loading?'Saving…':'Submit Full Profile'} <ChrIco/></button>
      }
    </div>
  </div>;
}

function decodeJwt(token) {
  try {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch(e) { return null; }
}

            {verifying ? 'Checking secure connection...' : 'Secure Human Connection Verified'}
          </div>
          <div style={{fontSize:10.5, color:'#6E6455', marginTop:2}}>
            {verifying ? `Verifying browser integrity (${percent}%)` : 'Browser verified as secure human'}
          </div>
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',alignItems:'center',opacity:0.65,zIndex:1}}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={verifying ? '#C9A84C' : '#16a34a'} strokeWidth="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span style={{fontSize:8, color:'#9E9282', marginTop:2, letterSpacing:0.3, textTransform:'uppercase', fontWeight:700}}>Turnstile</span>
      </div>
    </div>

    {/* Google Sign In Container (Unlocks and fades in upon verification) */}
    <div style={{
      height: verified ? 'auto' : '0px',
      overflow: 'hidden',
      opacity: verified ? 1 : 0,
      transition: 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
      marginTop: verified ? '20px' : '0px',
    }}>
      <div id="googleSignInDiv" style={{display:'flex',justifyContent:'center'}}></div>
    </div>
  </div>;
}

/* ── APP ──────────────────────────────────────────── */
function App(){
  const [user, setUser] = useState(null);
  const [fd2,setFd2]=useState({});
  
  if(!user) return <AuthGuard onLogin={setUser}/>;
  
  return <>
    <div className="fa" style={{marginTop: 40}}>
      <div style={{background:'rgba(201,168,76,.1)', border:'1px solid rgba(201,168,76,.3)', padding:'12px 16px', borderRadius:8, marginBottom:24, display:'flex', alignItems:'center', gap:12}}>
        <img src={user.picture} alt="Profile" style={{width:32, height:32, borderRadius:'50%'}} />
        <span style={{fontSize:14, color:'#1C1812', fontWeight:500}}>Logged in as {user.email}</span>
      </div>
      <StepForm sections={FULL_STARTUP} fd={fd2} setFd={setFd2} title="Full Startup Profile" urTitle="مکمل اسٹارٹ اپ پروفائل" desc="Complete 11-section investor-ready profile with all documents" user={user} tableName="premium_startup_applications"/>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
